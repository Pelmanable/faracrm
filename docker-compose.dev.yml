# Общие для postgres и шагов перехода 17 → 18 — чтобы не разъехались.
# Пользователь и пароль — из .env, те же, по которым подключается бэкенд.
# Postgres применяет их ТОЛЬКО при первом старте на пустом томе; потом пароль
# меняют в самой базе (deploy.md, «Пользователь и пароль базы»).
x-postgres-env: &postgres-env
  POSTGRES_DB: fara
  POSTGRES_USER: ${dotorm_databases_postgres__fara__user:-openpg}
  POSTGRES_PASSWORD: ${dotorm_databases_postgres__fara__password:-openpgpwd}

services:

  # ─── Переход PostgreSQL 17 → 18 ───────────────────────
  # Два одноразовых шага перед стартом postgres: дамп старого тома pgdata и
  # заливка его в новый том pgdata18. На свежей установке и после перехода
  # оба завершаются сразу. Старый том не меняется — он остаётся для отката.
  # Подробности: docs/dist/guides/deploy.md, «Переход на PostgreSQL 18».
  pg17-backup:
    image: postgres:17
    environment: *postgres-env
    entrypoint: ["bash", "/pg-upgrade/backup17.sh"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgdata18:/pg18:ro
      - ./backups/postgres:/backups
      - ./docker/pg-upgrade:/pg-upgrade:ro

  pg18-restore:
    image: postgres:18
    user: postgres
    environment: *postgres-env
    entrypoint: ["bash", "/pg-upgrade/restore18.sh"]
    depends_on:
      pg17-backup:
        condition: service_completed_successfully
    volumes:
      - pgdata18:/var/lib/postgresql
      - pgdata:/pg17:ro
      - ./backups/postgres:/backups:ro
      - ./docker/pg-upgrade:/pg-upgrade:ro

  # ─── PostgreSQL ────────────────────────────────────────
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment: *postgres-env
    depends_on:
      pg18-restore:
        condition: service_completed_successfully
    # ports:
      # - "5433:5432"
    # С 18 образ хранит данные в /var/lib/postgresql/18/docker — монтируется
    # родительский каталог, а не /var/lib/postgresql/data, как было в 17.
    volumes:
      - pgdata18:/var/lib/postgresql

    # PostgreSQL разумные дефолты для небольшого prod-стенда
    # (подобраны под 2 vCPU / 4 GB RAM — работают на любой машине от этого размера).
    # Если у тебя больше RAM — подкрути цифры по комментариям.
    # Формат: "наше значение   # PG default: <дефолт>"
    command:
      - "postgres"
      # ── Memory ────────────────────────────────────────
      # shared_buffers: главный кеш таблиц/индексов в RAM.
      # Правило: 25% RAM. Для 4GB = 256MB, 8GB = 1GB, 16GB = 4GB.
      - "-c"
      - "shared_buffers=512MB"               # PG default: 128MB
      # effective_cache_size: ПОДСКАЗКА планировщику (память не резервируется),
      # сколько данных помещается в OS page cache + shared_buffers.
      # Правило: 50-75% RAM. Для 4GB = 2GB, 8GB = 4GB, 16GB = 12GB.
      - "-c"
      - "effective_cache_size=4GB"           # PG default: 4GB
      # work_mem: RAM на каждую sort/hash операцию в запросе.
      # Дефолт 4MB безопасен — не взорвёт память при много коннектов.
      # Для 8GB+ RAM можно поднять до 16MB.
      - "-c"
      - "work_mem=8MB"                       # PG default: 4MB (оставлен)
      # maintenance_work_mem: RAM для VACUUM / CREATE INDEX.
      # Ускоряет создание индексов и вакуум. Для 8GB+ можно 512MB, 16GB+ — 1GB.
      - "-c"
      - "maintenance_work_mem=128MB"         # PG default: 64MB
      # ── Planner (SSD-оптимизированные) ────────────────
      # random_page_cost: стоимость random read vs sequential.
      # Дефолт 4.0 для HDD, для SSD/NVMe = 1.1. Разница критична — на HDD-дефолте
      # планировщик делает seq scan вместо index scan.
      - "-c"
      - "random_page_cost=1.1"               # PG default: 4.0 (HDD)
      # effective_io_concurrency: сколько параллельных IO-запросов может сделать диск.
      # Для SSD = 200, NVMe = 300, HDD = 2. По умолчанию 16.
      - "-c"
      - "effective_io_concurrency=200"       # PG default: 16
      # ── WAL / Checkpoints ─────────────────────────────
      # checkpoint_completion_target: размазывает IO от checkpoint по времени.
      # В PG 16+ уже дефолт 0.9, указан явно для явности.
      - "-c"
      - "checkpoint_completion_target=0.9"   # PG default: 0.9 (PG 16+)
      # ── Logging (диагностика) ─────────────────────────
      # Логирует запросы дольше 1000 мс — помогает ловить slow queries.
      - "-c"
      - "log_min_duration_statement=1000"    # PG default: -1 (off)
      # Логирует ожидания блокировок (lock contention).
      - "-c"
      - "log_lock_waits=on"                  # PG default: off
      - "-c"
      - "max_connections=150"               # PG default: 100

    # Dev shared memory для параллельных запросов и больших shared_buffers.
    # Дефолт Docker всего 64MB, не хватает даже для умеренного shared_buffers.
    # равно или чуть больше shared_buffers
    shm_size: 512MB                          # Docker default: 64MB

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Backend (FastAPI) ─────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        # LibreOffice в образе — точная вёрстка PDF-отчётов (см. .env.sample).
        # Аргумент сборки: после смены — docker compose up -d --build
        WITH_LIBREOFFICE: ${WITH_LIBREOFFICE:-1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # env_file:
    #   - .env
    environment:
      # DB config (env_nested_delimiter="__")

      DOTORM_DATABASES_POSTGRES__FARA__HOST: postgres
      DOTORM_DATABASES_POSTGRES__FARA__PORT: 5432
      DOTORM_DATABASES_POSTGRES__FARA__USER: ${dotorm_databases_postgres__fara__user:-openpg}
      DOTORM_DATABASES_POSTGRES__FARA__PASSWORD: ${dotorm_databases_postgres__fara__password:-openpgpwd}
      DOTORM_DATABASES_POSTGRES__FARA__DATABASE: fara
      DOTORM_DATABASES_POSTGRES__FARA__DRIVER: asyncpg
      DOTORM_DATABASES_POSTGRES__FARA__SYNC_DB: "true"

      # Workers count
      # WEB_WORKERS: 2

      # Disable SSL for local Docker postgres
      PGSSLMODE: disable

      # Logger
      LOGGER__LOG_LEVEL: DEBUG

      # Cookie only https, because use double token pattern
      # AUTH__COOKIE_SECURE: "false"
      # AUTH__COOKIE_NAME: session_cookie
      # AUTH__COOKIE_SAMESITE: lax

      # Cron settings
      # CRON__ENABLED: "true"
      # CRON__CHECK_INTERVAL: 60
      # CRON__MAX_THREADS: 2

      # Work with external api, Telegram, Whatsapp, Google etc...
      # SITE_URL: "https://mydomain.com"
      # API_URL: "https://mydomain.com/api"

      # SITE_URL: "http://127.0.0.1:7777"
      # API_URL: "http://127.0.0.1:7777/api"
    ports:
      - "8000:8000"
    volumes:
      - filestore_docker:/app/filestore
    security_opt:
      - no-new-privileges:true

  # ─── Frontend (Nginx + React SPA) ─────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "7777:80"
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata18:
  # Данные PostgreSQL 17: их читает только pg17-backup. После перехода том
  # можно удалить (deploy.md, «Переход на PostgreSQL 18»).
  pgdata:
  filestore_docker:
