# =============================================================
# FARA CRM — nginx конфиг
#
# Структура:
#   - / (SPA): React-приложение из /usr/share/nginx/html
#   - /api/ → backend FastAPI (uvicorn) на backend:8000
#   - /ws/  → WebSocket к тому же бэкенду
#   - /docs-dev/ → bundled API docs (dev)
#
# Безопасность через response headers (см. секцию ниже).
# Для production предполагается HTTPS-терминация выше (Traefik/
# Cloudflare/ELB). Если nginx крайний — добавить server { listen 443
# ssl; ... } и редирект с 80 → 443.
# =============================================================

# Скрыть версию nginx из заголовков и страниц ошибок
server_tokens off;

# Картинки/PDF не жмём — уже сжаты.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/json
    application/javascript
    application/xml
    text/css
    text/javascript
    text/plain
    text/xml
    image/svg+xml
    font/woff2;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Предел одного запроса, а не файла: файлы грузятся частями по 8 МБ,
    # размер файла (attachments.max_upload_size) держит бэкенд. 32 МБ —
    # часть с запасом и шаблон DOCX в предпросмотре конструктора отчётов.
    # То же значение — в deploy/proxy/nginx/templates/fara.conf.template.
    client_max_body_size 32m;

    # nosniff: запрещает браузеру MIME-sniffing — ключевая защита
    # от XSS-через-attachment (HTML/SVG, отправленный с фейковым MIME).
    add_header X-Content-Type-Options "nosniff" always;

    # Защита от clickjacking — нашу страницу нельзя засунуть в чужой iframe.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Не утекать полные URL во внешние ссылки и картинки.
    # На свой домен — полный URL. На чужой — только origin. С https на http — ничего.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Отключаем браузерные API, которые приложение не использует.
    # Если используете geolocation/camera/mic — убрать соответствующие пункты.
    # add_header Permissions-Policy
    #     "geolocation=(), microphone=(), camera=(), payment=()" always;

    # ВАЖНО про "always": без него nginx добавляет add_header только к
    # 2xx/3xx ответам. Хочется иметь заголовки и на 4xx/5xx (страницы
    # ошибок тоже могут пытаться эксплуатировать).

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Где у этого nginx файлстор (location /filestore/ ниже): с этим
        # заголовком бэкенд не отдаёт файл сам, а отвечает X-Accel-Redirect.
        # proxy_set_header перезаписывает значение, присланное клиентом
        proxy_set_header X-Accel-Mapping /app/filestore/=/filestore/;

        # Таймауты — между двумя чтениями/записями, а не на весь запрос.
        # 300 с — отчётам, импорту и сохранению записи с файлом (отправка
        # файла в облачное хранилище пока идёт внутри этого запроса).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Не буферизуем ответы бэкенда — для streaming (например,
        # при скачивании большого attachment) и для предсказуемой
        # latency.
        proxy_buffering off;
    }

    # Файлы вложений с диска отдаёт nginx: бэкенд проверяет права и
    # отвечает X-Accel-Redirect: /filestore/<путь> (видит X-Accel-Mapping из
    # location /api/). internal — снаружи сюда не зайти; ^~ — чтобы .png/.svg
    # не ушли в location статики ниже. Том файлстора смонтирован только на
    # чтение. То же — в deploy/proxy/nginx/templates/fara.conf.template.
    location ^~ /filestore/ {
        internal;
        alias /app/filestore/;
    }

    # =========================================================
    # WebSocket → backend
    # =========================================================
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;

        # Upgrade-семантика для WS
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Клиентский контекст
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WS-сессии живут долго (чат). 1 сутки.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Для WS буферизация ОБЯЗАТЕЛЬНО выключена — иначе сообщения
        # от сервера копятся в буфере nginx и не доезжают до клиента.
        proxy_buffering off;
    }

  location /docs-dev/ {
        proxy_pass http://backend:8000/docs-dev/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статика с хешированными именами (Vite кладёт hash в filename) —
    # кэшируем агрессивно, immutable. Размещаем ВЫШЕ "location /",
    # чтобы regex отработал первым по приоритету nginx.
    #
    # Внимание: SVG здесь — это статика приложения (иконки в bundle),
    # она безопасна и кэшируется. SVG-attachments идут через /api/ и
    # подчиняются другим правилам (см. секцию выше про nosniff).
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|webp|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        # Дублируем security headers — add_header в location полностью
        # переопределяет add_header из server { }, поэтому повторяем.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html — НЕ кэшировать. Иначе после деплоя пользователь видит
    # старый index.html, который ссылается на несуществующие хешированные
    # бандлы → белый экран.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        # Скрипты — только файлы самого приложения: обработчики в разметке
        # (onerror=, onclick=…) и ссылки javascript: браузер не выполняет,
        # даже если чужой HTML (ячейка таблицы, письмо) попал в страницу
        # через innerHTML. 'unsafe-eval' — FortuneSheet собирает функции
        # через new Function. Заголовок только у страницы приложения (сюда
        # приходит и SPA-фолбэк из location /): ответы /api/ — файлы, PDF
        # во вкладке — идут без него.
        add_header Content-Security-Policy "script-src 'self' 'unsafe-eval'" always;
        try_files $uri =404;
    }

    # SPA fallback: всё остальное → index.html (React Router сам разберётся).
    location / {
        try_files $uri $uri/ /index.html;
    }
}